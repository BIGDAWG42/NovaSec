name: Build NovaSec ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout NovaSec
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            git \
            curl

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build NovaSec
        run: sudo ./build.sh

      - name: Find generated ISO
        run: |
          echo "Generated ISO files:"
          sudo find . -type f -name "*.iso" -print

      - name: Upload NovaSec ISO
        uses: actions/upload-artifact@v4
        with:
          name: NovaSec-0.1-amd64
          path: |
            **/*.iso
          if-no-files-found: error
          retention-days: 7
